# ITS Plants Profile
# For plant community analysis using Internal Transcribed Spacer
# Requires a custom-trained RDP classifier
# Enables ITSx extraction for ITS2 region

profile:
  name: "its_plants"
  description: "ITS metabarcoding for plants"
  marker: "ITS_plants"

# Enable ITSx extraction
modules:
  itsx_extraction: true
  pseudogene_filtering: false

# ITSx extraction settings
itsx_extraction:
  its_part: "ITS2"

# Classification settings
classification:
  marker: "ITS_plants"
  rdp:
    use_custom_classifier: true
    classifier_path: null
