# Default configuration used by the control-node API for OTU runs.
# Note: The OTU workflow requires a corresponding `Snakefile_OTU` to be present on the server.
pipeline:
  name: "otu"
  output_dir: "OTU_results"
  parallel_jobs: 4

input:
  sample_source: "folder"
  samples_csv: "samples.csv"
  fastq_dir: "tests/testing_data"

modules:
  preprocessing: true
  trimming: true
  denoising: true
  classification: true
  classification_engine: "rdp"
  pseudogene_filtering: false
  stats: true

preprocessing:
  quality_score: 13
  min_overlap: 25
  max_mismatch: 0.02
  min_match: 0.9

trimming:
  adapters: "tests/adapters_anchored.fasta"
  min_length: 150
  quality_cutoff: "20,20"
  error_rate: 0.1
  min_adapter_overlap: 3
  max_n_bases: 3
  enable_rc: true

denoising:
  pool_samples: true
  min_cluster_size: 8
  threads: 4

classification:
  marker: "COI"
  min_confidence: 0.8
  rdp:
    memory_gb: 20
    use_custom_classifier: true
    classifier_path: "runtime/classifiers/COI.properties"
    builtin_classifier: "fungallsu"
  sintax:
    db_fasta: null
    cutoff: null
    threads: 4

pseudogene_filtering:
  method: "hmm"
  grep_type: 1
  taxon1: "-e Arthropoda"
  taxon2: "-v Chordata"
  hmm_profile: "config/hmm/bold.hmm"
  genetic_code: 5
  orf_start_codon: 2
  min_orf_length: 30
  ignore_nested_orfs: true
  strand: "plus"

stats:
  per_sample: true
  combined: true

output:
  report_type: 1
  include_intermediate: false
  compress_output: true
  html_report: false
