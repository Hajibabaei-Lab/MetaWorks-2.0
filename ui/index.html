<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MetaWorks control node UI for submitting and monitoring pipeline runs."
    />
    <title>MetaWorks</title>
    <link rel="stylesheet" href="./assets/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <div class="brand-title">MetaWorks</div>
            <div class="brand-subtitle">Pipeline control node</div>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="#/submit" data-route="submit">Submit Run</a>
          <a class="nav-link" href="#/runs" data-route="runs">Runs</a>
          <a class="nav-link" href="#/config" data-route="config">Config</a>
          <a class="nav-link" href="#/assets" data-route="assets">Assets</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container app-main">
      <div id="app" class="app" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
      <div class="container footer-inner">
        <div class="muted">MetaWorks Control Node UI</div>
        <div class="muted">
          <a class="link" href="/docs" target="_blank" rel="noreferrer">API docs</a>
        </div>
      </div>
    </footer>

    <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="true"></div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
