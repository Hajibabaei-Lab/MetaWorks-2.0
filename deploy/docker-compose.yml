services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: metaworks-backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      METAWORKS_DEFAULT_RUNTIME: conda
      METAWORKS_ALLOWED_RUNTIMES: ${METAWORKS_ALLOWED_RUNTIMES:-conda}
      METAWORKS_SERVE_LEGACY_UI: "0"
      METAWORKS_CORS_ALLOWED_ORIGINS: ${METAWORKS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - metaworks-runtime:/MetaWorks/runtime
      - ./inputs:/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: ${METAWORKS_UI_CONTEXT:-../../metaworks-ui}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: metaworks-frontend
    depends_on:
      - backend
    ports:
      - "${METAWORKS_FRONTEND_BIND:-127.0.0.1:8080:8080}"
    restart: unless-stopped

volumes:
  metaworks-runtime:
