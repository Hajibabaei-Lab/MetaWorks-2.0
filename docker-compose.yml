version: '3.8'

services:
  metaworks:
    build: .
    container_name: metaworks-ui
    ports:
      - "8000:8000"
    volumes:
      # Runtime directories
      - ./runtime:/workspace/runtime
      # Input data (optional - bind your data directory)
      # - ./input:/workspace/input:ro
      # Config files
      - ./config:/workspace/config:ro
    environment:
      - METAWORKS_REPO_ROOT=/workspace
      - METAWORKS_RUN_ROOT=/workspace/runtime/runs
      - METAWORKS_ARTIFACT_ROOT=/workspace/runtime/artifacts
      - METAWORKS_ADAPTER_ROOT=/workspace/runtime/adapters
      - METAWORKS_CLASSIFIER_ROOT=/workspace/runtime/classifiers
      - METAWORKS_STAGING_ROOT=/workspace/runtime/staging
      - METAWORKS_SINGULARITY_CACHE=/workspace/runtime/cache
      - METAWORKS_DEFAULT_RUNTIME=docker
      - METAWORKS_CONTAINER_IMAGE=docker://metaworks:latest
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
