name: release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/hajibabaei-lab/metaworks-backend
  FRONTEND_IMAGE: ghcr.io/hajibabaei-lab/metaworks-frontend

jobs:
  publish-github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file CHANGELOG.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file CHANGELOG.md

  build-and-push:
    needs: publish-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build backend image (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metaworks-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: metaworks-frontend:test
          build-args: VITE_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - backend API health
        run: |
          docker run -d --name backend-test -p 8000:8000 \
            -e METAWORKS_DEFAULT_RUNTIME=conda \
            -e METAWORKS_ALLOWED_RUNTIMES=conda \
            metaworks-backend:test \
            uvicorn api.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health 2>/dev/null | grep -q "ok"; then
              echo "API health check passed"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          HEALTH=$(curl -sf http://localhost:8000/api/health)
          echo "Response: $HEALTH"
          echo "$HEALTH" | grep -q "ok" || { docker logs backend-test; exit 1; }
          docker stop backend-test

      - name: Smoke test - backend CLI
        run: |
          docker run --rm metaworks-backend:test snakemake --version

      - name: Smoke test - frontend HTTP
        run: |
          docker run -d --name frontend-test -p 8080:8080 metaworks-frontend:test
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8080 2>/dev/null; then
              echo "Frontend HTTP check passed"
              break
            fi
            echo "Waiting for frontend... ($i/15)"
            sleep 2
          done
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200" || { docker logs frontend-test; exit 1; }
          docker stop frontend-test

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: VITE_API_BASE=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
