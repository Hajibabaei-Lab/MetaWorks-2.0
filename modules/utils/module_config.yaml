# Utilities Module Configuration
# DO NOT EDIT UNLESS YOU ARE A DEVELOPER
# This file contains defaults and metadata for the utils module

module:
  name: "utils"
  version: "2.0.0"
  description: "Utility functions for results consolidation and file management"
  author: "Hajibabaei Lab"
  enabled_by_default: true

# Default Parameters (can be overridden by user config)
parameters:
  utils:
    combined_report: true     # Generate combined report (true/false)
    include_intermediate: false  # Include intermediate files in output (true/false)
    cleanup_temp: true        # Clean up temporary files (true/false)
  
  output:
    compress: true            # Compress output files (true/false)
    format: "csv"            # Output format: "csv", "tsv", "json"
  
  defaults:
    output_prefix: "results"  # Prefix for output files

# Input/Output File Templates
files:
  inputs:
    - esv_table: "{output_dir}/ESV.table"
    - taxonomy: "{output_dir}/taxonomy.csv"
    - sequences: "{output_dir}/cat.denoised.nonchimeras"
    - stats: "{output_dir}/stats/*.csv"
  
  outputs:
    - results_csv: "{output_dir}/results.csv"
    - results_summary: "{output_dir}/results_summary.txt"
    - file_manifest: "{output_dir}/manifest.txt"

# Required Software
software:
  conda:
    - "python>=3.8"
    - "biopython>=1.70"
  
  external: []

# Validation Rules
validation:
  - parameter: "format"
    type: "string"
    allowed: ["csv", "tsv", "json"]
    description: "Output file format"

# Resource Requirements
resources:
  default:
    threads: 1
    memory_mb: 2000
    time_minutes: 30
  
  high_load:
    threads: 2
    memory_mb: 4000
    time_minutes: 45

# Module Dependencies
depends_on:
  - "stats"

# Checkpoints
checkpoints:
  - name: utils_complete
    trigger: "Utilities processing complete"
    output: "{output_dir}/checkpoints/utils_complete.done"
