# Preprocessing Module
# Handles read pairing with SeqPrep

module:
  name: "preprocessing"
  version: "2.0.0"
  description: "Pair forward and reverse Illumina reads using SeqPrep"
  author: "Hajibabaei Lab"
  
inputs:
  required:
    - fastq_dir: "Directory containing paired-end FASTQ files"
    - dir: "Output directory for results"
    - sample_source: "Sample input method ('folder' or 'csv')"
  
  optional:
    - samples_csv: "CSV file with sample information (required if sample_source='csv')"

outputs:
  primary:
    - paired_reads: "{dir}/paired/{sample}.fastq.gz"
  
  intermediate:
    - unpaired_r1: "temp({sample}_R1.out)"
    - unpaired_r2: "temp({sample}_R2.out)"
  
  logs:
    - pairing_log: "{dir}/logs/pairing/{sample}.log"

checkpoints:
  - name: pairing_complete
    trigger: "All samples successfully paired"
    output: "{dir}/checkpoints/pairing_complete.done"

dependencies:
  conda:
    - "seqprep>=1.3"
    - "python>=3.8"
  
  scripts:
    - "lib.utils.file_utils"
  
  modules: []

parameters:
  seqprep:
    q: 13      # Phred score quality cutoff
    o: 25      # Minimum overlap length between forward and reverse reads
    m: 0.02    # Maximum fraction of mismatches allowed in overlap
    n: 0.90    # Minimum fraction of matching overlap

resources:
  threads: 1
  memory_mb: 2000
  time_minutes: 30

validation:
  - check: "directory_exists"
    param: "fastq_dir"
  - check: "value_in_list"
    param: "sample_source"
    values: ["folder", "csv"]
