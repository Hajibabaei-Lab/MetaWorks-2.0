# Trimming Module Configuration
# DO NOT EDIT UNLESS YOU ARE A DEVELOPER
# This file contains defaults and metadata for the trimming module

module:
  name: "trimming"
  version: "2.0.0"
  description: "Trim linked adapters from paired reads using Cutadapt"
  author: "Hajibabaei Lab"
  enabled_by_default: true

# Default Parameters (can be overridden by user config)
parameters:
  cutadapt:
    min_length: 150            # Minimum sequence length after trimming (bp)
    quality_cutoff: "20,20"    # Quality cutoffs for read ends (5' and 3')
    error_rate: 0.1            # Maximum allowed error rate (0.0-1.0)
    min_adapter_overlap: 3     # Minimum adapter overlap (bp)
    max_n_bases: 3             # Maximum number of N's allowed
    enable_rc: false           # Enable reverse complement mode (true/false)
  
  defaults:
    output_prefix: "trimmed"   # Prefix for output files
    compression: true          # Compress output files

# Input/Output File Templates
files:
  inputs:
    - merged_reads: "{output_dir}/preprocessed/{sample}.merged.fastq.gz"
    - adapter_file: "{adapters_path}"
  
  outputs:
    - trimmed: "{output_dir}/trimmed/{sample}.fasta.gz"
    - trimmed_uncompressed: "{output_dir}/trimmed/{sample}.fasta"

# Required Software
software:
  conda:
    - "cutadapt>=4.0"
    - "python>=3.8"
  
  external: []

# Validation Rules
validation:
  - parameter: "min_length"
    type: "integer"
    min: 10
    max: 10000
    description: "Minimum sequence length after trimming (bp)"
  
  - parameter: "error_rate"
    type: "float"
    min: 0.0
    max: 1.0
    description: "Maximum allowed error rate (0.0-1.0)"
  
  - parameter: "min_adapter_overlap"
    type: "integer"
    min: 1
    max: 50
    description: "Minimum adapter overlap (bp)"
  
  - parameter: "max_n_bases"
    type: "integer"
    min: 0
    max: 100
    description: "Maximum number of N bases allowed"

# Resource Requirements
resources:
  default:
    threads: 1
    memory_mb: 4000
    time_minutes: 60
  
  high_load:
    threads: 2
    memory_mb: 8000
    time_minutes: 90

# Module Dependencies
depends_on:
  - "preprocessing"

# Checkpoints
checkpoints:
  - name: trimming_complete
    trigger: "Adapter trimming complete"
    output: "{output_dir}/checkpoints/trimming_complete.done"
