# Denoising Module
# Handles ESV (Exact Sequence Variant) generation using VSEARCH

module:
  name: "denoising"
  version: "2.0.0"
  description: "Generate ESVs using VSEARCH with dereplication, denoising, and chimera removal"
  author: "Hajibabaei Lab"

inputs:
  required:
    - dir: "Output directory for results"
    - SAMPLES_UNIQUE: "List of samples to process (from trimming module)"

  optional:
    - pooling: "Whether to pool samples ('Yes' or 'No', default: 'Yes')"

outputs:
  primary:
    - esv_table: "{dir}/ESV.table.tmp"
    - denoised_sequences: "{dir}/cat.denoised.nonchimeras"

  intermediate:
    - concatenated_fasta: "{dir}/cat.fasta.gz"
    - dereplicated_uniques: "{dir}/cat.uniques"
    - denoised_centroids: "{dir}/cat.denoised"

  logs:
    - dereplication_log: "{dir}/dereplication.log"
    - denoising_log: "{dir}/denoising.log"
    - chimera_removal_log: "{dir}/chimeraRemoval.log"
    - table_log: "{dir}/table.log"

checkpoints:
  - name: denoising_complete
    trigger: "All samples denoised and ESV table created"
    output: "{dir}/checkpoints/denoising_complete.done"

dependencies:
  conda:
    - "vsearch>=2.15"
    - "python>=3.8"

  scripts:
    - "python_scripts/merge_esv_tables.py"

  modules:
    - "trimming"

parameters:
  vsearch_denoise:
    minsize: 8    # Minimum abundance to retain cluster (default: 8)

  vsearch_table:
    t: 4          # Number of threads for table creation

resources:
  threads: 4
  memory_mb: 8000
  time_minutes: 120

validation:
  - check: "value_in_list"
    param: "pooling"
    values: ["Yes", "No", null]
  - check: "value_positive"
    param: "vsearch_denoise.minsize"
