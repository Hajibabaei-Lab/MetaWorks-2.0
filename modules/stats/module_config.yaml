# Statistics Module Configuration
# DO NOT EDIT UNLESS YOU ARE A DEVELOPER
# This file contains defaults and metadata for the statistics module

module:
  name: "stats"
  version: "2.0.0"
  description: "Generate pipeline statistics and reports"
  author: "Hajibabaei Lab"
  enabled_by_default: true

# Default Parameters (can be overridden by user config)
parameters:
  stats:
    per_sample: true          # Generate per-sample statistics (true/false)
    combined: true            # Generate combined statistics (true/false)
    include_intermediate: false  # Include intermediate files in report (true/false)

  output:
    format: "csv"            # Output format: "csv", "tsv", "json"
    compression: true         # Compress output files (true/false)

  defaults:
    output_prefix: "stats"    # Prefix for output files

# Input/Output File Templates
files:
  inputs:
    - esv_table: "{output_dir}/ESV.table"
    - taxonomy: "{output_dir}/taxonomy.csv"
    - preprocessed: "{output_dir}/preprocessed/*.stats"

  outputs:
    - summary_report: "{output_dir}/results_summary.csv"
    - per_sample_stats: "{output_dir}/stats_per_sample.csv"
    - combined_stats: "{output_dir}/stats_combined.csv"
    # HTML report not yet implemented - reserved for future
    # - html_report: "{output_dir}/report.html"

# Required Software
software:
  conda:
    - "python>=3.8"
    - "biopython>=1.70"

  external:
    - "python_scripts/fasta_gz_stats.py"
    - "python_scripts/fastq_gz_stats.py"
    - "python_scripts/add_abundance_to_rdp_out.py"

# Validation Rules
validation:
  - parameter: "format"
    type: "string"
    allowed: ["csv", "tsv", "json"]
    description: "Output file format"

# Resource Requirements
resources:
  default:
    threads: 1
    memory_mb: 4000
    time_minutes: 60

  high_load:
    threads: 2
    memory_mb: 8000
    time_minutes: 90

# Module Dependencies
depends_on:
  - "pseudogene"

# Checkpoints
checkpoints:
  - name: stats_complete
    trigger: "Statistics generation complete"
    output: "{output_dir}/checkpoints/stats_complete.done"
