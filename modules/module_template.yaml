# Module Template
# This is the standard structure for module.yaml files

module:
  name: "module_name"
  version: "2.0.0"
  description: "Brief description of what this module does"
  author: "Author Name"
  
inputs:
  required:
    # List required input parameters and their descriptions
    # Example:
    # - input_dir: "Directory containing input files"
    # - sample_list: "List of samples to process"
  
  optional:
    # List optional input parameters with defaults
    # Example:
    # - threads: "Number of threads to use (default: 4)"
    # - quality_threshold: "Quality score threshold (default: 20)"

outputs:
  primary:
    # Main outputs that other modules will use
    # Example:
    # - processed_files: "{dir}/processed/{sample}.fastq"
  
  intermediate:
    # Temporary files that may be needed for debugging
    # Example:
    # - stats: "{dir}/stats/{sample}.stats"
  
  logs:
    # Log files
    # Example:
    # - log_file: "{dir}/logs/{sample}.log"

checkpoints:
  # List checkpoint rules that signal completion of major stages
  # Example:
  # - name: processing_complete
  #   trigger: "All samples processed successfully"
  #   output: "{dir}/checkpoints/processing_complete.done"

dependencies:
  conda:
    # List required conda packages
    # Example:
    # - "cutadapt>=4.0"
    # - "python>=3.8"
  
  scripts:
    # List required Python scripts from lib/
    # Example:
    # - "lib.preprocessing.fastq_stats"
  
  modules:
    # List other modules this module depends on
    # Example:
    # - "common/validation"

parameters:
  # Default parameters for this module
  # These can be overridden in the main config
  # Example:
  # tool_name:
  #   param1: value1
  #   param2: value2

resources:
  # Resource requirements
  threads: 1
  memory_mb: 4000
  time_minutes: 60

validation:
  # Input validation rules
  # Example:
  # - check: "file_exists"
  #   param: "input_dir"
  # - check: "value_in_range"
  #   param: "quality_threshold"
  #   min: 0
  #   max: 40
