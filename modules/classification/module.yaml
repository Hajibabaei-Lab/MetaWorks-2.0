# Classification Module
# Handles taxonomic assignment using RDP Classifier

module:
  name: "classification"
  version: "2.0.0"
  description: "Taxonomic assignment of ESVs using RDP Classifier with parallel processing"
  author: "Hajibabaei Lab"

inputs:
  required:
    - dir: "Output directory for results"
    - cat.denoised.nonchimeras: "Denoised sequences from denoising module"

  optional:
    - marker: "Marker gene being analyzed (for RDP options)"

outputs:
  primary:
    - rdp_output: "{dir}/rdp.out.tmp"

  intermediate:
    - chunk_files: "temp({dir}/rdp_chunks/chunk_*.fasta)"
    - result_files: "temp({dir}/rdp_chunks/chunk_*.result)"

  logs:
    - classification_log: "{dir}/logs/classification.log"

checkpoints:
  - name: classification_complete
    trigger: "Taxonomic assignment complete"
    output: "{dir}/checkpoints/classification_complete.done"

dependencies:
  conda:
    - "rdp_classifier>=2.12"
    - "python>=3.8"
    - "biopython>=1.70"

  scripts:
    - "python_scripts/parallel_rdp.py"

  modules:
    - "denoising"

parameters:
  rdp:
    memory: "20g"              # Amount of memory to allocate to RDP classifier
    custom: "yes"             # Whether using custom-trained dataset
    t: "path/to/rRNAClassifier.properties"  # Path to classifier properties (if custom)
    c: 0                      # For 16S built-in classifier
    f: "fixrank"              # For 16S built-in classifier
    g: "fungallsu"            # For fungal built-in classifier

resources:
  threads: 4
  memory_mb: 20000
  time_minutes: 240

validation:
  - check: "value_in_list"
    param: "rdp.custom"
    values: ["yes", "no"]
  - check: "file_exists"
    param: "rdp.t"
    condition: "rdp.custom == 'yes'"
